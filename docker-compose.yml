services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_WS_URL=ws://backend:8000
    depends_on:
      - backend
    networks:
      - deepverify

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=deepverify
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=deepverify-dev-secret-change-in-production
      - CORS_ORIGINS=http://localhost:5173
      - WATCHFILES_FORCE_POLLING=1
      - SARVAM_API_KEY=${SARVAM_API_KEY:-sk_0l2l2gl8_XCCV2rvtlznZCfpFRsW9xAFl}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-AKIATVEB66WAAI2NUJWA}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-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}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - REKOGNITION_SIMILARITY_THRESHOLD=${REKOGNITION_SIMILARITY_THRESHOLD:-80.0}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-kqwq9gmu}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-158693447845986}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-DW_p6XUseTCPpZPa3KoHc0da4NI}
    depends_on:
      - mongodb
      - redis
    cap_add:
      - NET_RAW
    networks:
      - deepverify

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - deepverify

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - deepverify

volumes:
  mongo_data:
  redis_data:

networks:
  deepverify:
    driver: bridge
